# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_window_status_style "rounded-slant"
set -g @catppuccin_window_status_style "custom"
# Rounded edges for numbers on the right, without reverse-video attributes.
set -g @catppuccin_window_left_separator "#[noreverse,fg=#{@catppuccin_window_text_color},bg=default]#[none]"
set -g @catppuccin_window_right_separator "#[noreverse,fg=#{@catppuccin_window_number_color},bg=default]#[none]"
set -g @catppuccin_window_current_left_separator "#[noreverse,fg=#{@catppuccin_window_current_text_color},bg=default]#[none]"
set -g @catppuccin_window_current_right_separator "#[noreverse,fg=#{@catppuccin_window_current_number_color},bg=default]#[none]"
# set -g @catppuccin_window_status_style "slanted"

set -ogq @window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},}"

set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W#{E:#{E:@window_flags_icon_format}} "
set -g @catppuccin_window_current_fill "number"
# set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
# set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}#{?pane_synchronized,#[fg=#f38ba8] 󰓦,}"
set -g @catppuccin_window_current_text "#W#{E:#{E:@window_flags_icon_format}} #{?pane_synchronized, ,}"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -ogq @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "all" # no effect in latest version

set -g @catppuccin_directory_text " #{b:pane_current_path}"
set -g @catppuccin_date_time_text " %H:%M %d.%m.%Y"

run ~/.config/tmux/plugins/catppuccin-tmux/catppuccin.tmux

# manually override after default init is done
set -g @catppuccin_window_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_number_color "#{@thm_yellow}"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
# set -ag status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_pomodoro_plus}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Remove backgrounds from specific Catppuccin window elements
set -g @catppuccin_window_default_background "default"
set -g @catppuccin_window_current_background "default"
