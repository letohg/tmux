source-file ~/.config/tmux/conf/core.conf
source-file ~/.config/tmux/conf/keybinds.conf
source-file ~/.config/tmux/conf/navigation.conf
source-file ~/.config/tmux/conf/plugins.conf
source-file ~/.config/tmux/conf/theme.conf

if-shell '[ -f ~/.config/tmux/conf/local.conf ]' 'source-file ~/.config/tmux/conf/local.conf'

run '~/.tmux/plugins/tpm/tpm'

# Keep only the status bar's own background transparent. Must run after TPM
# (above), since TPM re-initializes the catppuccin plugin and would otherwise
# clobber this override. Deliberately does not touch @catppuccin_status_background,
# since that also drives the window separator color used by the rounded tab style.
set -g status-style "bg=default,fg=#{@thm_fg}"
